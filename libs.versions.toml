[versions]
loom = "1.7.+"
githubRelease = "2.4.1"
minotaur = "2.+"

mc = "1.20.1"
fl = "0.15.0"
yarn = "1.20.1+build.10"
fapi = "0.83.0+1.20.1"

switchy = "2.9.5+1.20"

[plugins]
loom = { id = "fabric-loom", version.ref = "loom" }
